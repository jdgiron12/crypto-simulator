# Default configuration for the Crypto Market Simulator.
# Override any value via environment variables (see settings.py) or by
# pointing CRYPTOSIM_CONFIG_PATH at an alternate YAML file.

simulation:
  starting_balance: 100000.0
  base_currency: "USD"
  tick_interval_seconds: 1.0
  random_seed: 42

market:
  assets: ["BTC", "ETH", "SOL"]
  initial_prices:
    BTC: 60000.0
    ETH: 3000.0
    SOL: 150.0
  volatility: 0.02

# Minimum-viable single-coin economy simulation (core.coin_simulator).
# Separate from `market` above, which drives the multi-asset trading
# engine/dashboard.
coin:
  symbol: "FIC"
  name: "FictiCoin (Simulated)"
  initial_supply: 1000000.0
  starting_price: 1.0
  volatility: 0.03
  base_volume_pct: 0.01
  # Large holders capable of moving price with a single outsized trade.
  # Empty list = Phase 1 behavior (pure random walk, no whales).
  # Optional fields (random_walk mode; leave them out for the original
  # unfunded whale that trades against unlimited external liquidity):
  #   starting_cash: 100000.0      # funds the whale: it then settles against
  #                                # the market reserve, conserving coins/cash
  #   behavior: "accumulate"       # neutral (default) | accumulate | distribute;
  #                                # accumulate/distribute need starting_cash
  #   target_coin_fraction: 0.6    # accumulate/distribute only: manage toward
  #                                # this share of portfolio value in coins,
  #                                # in bounded steps that never cross it
  #   min_trade_fraction: 0.0      # trade size is uniform in [min, max] × supply
  #   cooldown_ticks: 0            # ticks to sit out after each trade that
  #                                # moved coins (any whale)
  #   min_trade_interval_ticks: 0  # funded whales only: minimum ticks between
  #                                # successful trades (execution pacing). N
  #                                # blocks the next N ticks, so the earliest
  #                                # next trade is N + 1 ticks later; the whale
  #                                # waits out whichever of the two is longer
  #   intent_strength: 1.0         # accumulate/distribute only (neutral ignores
  #                                # it): how hard the whale leans, scaling the
  #                                # size it asks for. 0.0-2.0, default 1.0 =
  #                                # unchanged. The target, the whale's balances
  #                                # and the reserve still cap every fill.
  whales:
    - id: "whale-1"
      holdings: 50000.0
      activity_probability: 0.15
      max_trade_fraction: 0.04
      impact_coefficient: 2.0
  # "Rest of the market" counterparty for trader agents: holds every coin
  # not owned by a whale or trader, plus this much cash. Trader fills
  # settle against it, so coins and cash are conserved.
  market_reserve_cash: 1000000.0
  # Price impact of each tick's net trader flow (same linear model as whales).
  # Used in random_walk mode only.
  trader_impact_coefficient: 2.0
  # Market pricing model (override with CRYPTOSIM_PRICING_MODE):
  #   random_walk — GBM random walk + linear whale/trader impact; traders
  #                 settle against the market reserve. (default)
  #   amm         — constant-product liquidity pool (x * y = k) seeded by the
  #                 market reserve; traders swap through it. No random walk.
  #                 Whales are not supported in this mode yet.
  pricing_mode: "random_walk"
  amm:
    # Coins the market reserve deposits; the cash side is
    # pool_coin_reserve × starting_price, so the pool opens at the starting
    # price. Omit to deposit as much as the reserve can pair.
    pool_coin_reserve: 200000.0
    # Swap fee, charged on the input asset; it stays in the pool reserves
    # (deepening liquidity, owed to LPs) and is reported on every swap.
    fee_rate: 0.003
  # Fictional news/external events. No scheduled events and random
  # probability 0 = no events (baseline behavior). Events never set a price:
  # they shift trader sentiment/participation (both modes) and random-walk
  # volatility. `python scripts/simulate_coin.py --events` runs a demo schedule.
  events:
    # random_walk only: extra log-drift per tick at sentiment ±1. Must stay
    # 0.0 in amm mode, where events act only through traders.
    drift_per_sentiment: 0.0
    # category: a key of core.events.EVENT_CATEGORIES; effects are the
    # category's defaults × severity unless overridden. Example:
    #   - id: "listing-1"
    #     category: "exchange_listing"
    #     severity: 0.8           # (0, 1]
    #     start_tick: 20
    #     duration: 5             # ticks at full strength
    #     decay_ticks: 10         # then fades linearly to nothing
    #     # optional: headline, sentiment, volatility_boost, attention
    scheduled: []
    # Randomly generated events — configuration only for now; a probability
    # above 0 is rejected until random generation is implemented.
    random:
      probability: 0.0            # per-tick chance of a new event
      categories: {}              # category -> weight; empty = whole catalog
      severity: [0.3, 1.0]
      duration: [2, 8]
      decay_ticks: [5, 20]
  # Market manipulators (educational). Empty = no manipulation. Same fields
  # as `traders`; they trade after the traders each tick.
  # strategy: pump_and_dump | wash_trader
  # Ready-made setups: `python scripts/simulate_coin.py --scenario pump_and_dump`
  # (see MANIPULATION_SCENARIOS in services/coin_simulation.py). Example:
  #   - id: "pump-and-dump-1"
  #     strategy: "pump_and_dump"
  #     starting_cash: 30000.0
  #     trade_probability: 1.0      # keep 1.0 so the schedule runs as planned
  #     max_trade_size: 100000.0
  #     risk_tolerance: 1.0         # share of starting cash committed
  #     params:
  #       start_tick: 5
  #       accumulate_ticks: 10
  #       accumulate_share: 0.3     # share of the budget bought while accumulating
  #       pump_ticks: 2
  #       dump_ticks: 3
  manipulators: []
  # Rule-based trader agents. Empty list = no traders (whale-only behavior).
  # strategy: retail | momentum | dip_buyer | panic_seller | long_term_holder
  # risk_tolerance: fraction of available cash (buys) / coins (sells) per trade.
  # max_trade_size: hard per-trade cap, in coins.
  traders:
    - id: "retail-1"
      strategy: "retail"
      starting_cash: 5000.0
      starting_coins: 5000.0
      trade_probability: 0.6
      max_trade_size: 2000.0
      risk_tolerance: 0.3
      params:
        buy_bias: 0.5
    - id: "momentum-1"
      strategy: "momentum"
      starting_cash: 40000.0
      starting_coins: 10000.0
      trade_probability: 0.7
      max_trade_size: 15000.0
      risk_tolerance: 0.5
      params:
        lookback: 5
        entry_threshold: 0.03
        exit_threshold: 0.03
    - id: "dip-buyer-1"
      strategy: "dip_buyer"
      starting_cash: 40000.0
      starting_coins: 0.0
      trade_probability: 0.6
      max_trade_size: 15000.0
      risk_tolerance: 0.5
      params:
        lookback: 10
        dip_threshold: 0.06
        take_profit: 0.12
    - id: "panic-seller-1"
      strategy: "panic_seller"
      starting_cash: 5000.0
      starting_coins: 30000.0
      trade_probability: 0.8
      max_trade_size: 20000.0
      risk_tolerance: 0.8
      params:
        lookback: 5
        panic_threshold: 0.08
        reentry_threshold: 0.08
    - id: "long-term-holder-1"
      strategy: "long_term_holder"
      starting_cash: 20000.0
      starting_coins: 60000.0
      trade_probability: 0.1
      max_trade_size: 5000.0
      risk_tolerance: 0.25
      params:
        take_profit_multiple: 3.0
        max_buy_premium: 0.2

database:
  path: "data/simulator.db"
  echo: false

ui:
  page_title: "Crypto Market Simulator"
  page_icon: "📈"
  layout: "wide"

logging:
  level: "INFO"
  format: "%(asctime)s | %(levelname)-8s | %(name)s | %(message)s"
