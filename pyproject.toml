[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-simulator"
version = "1.0.0"
description = "A fictional, educational cryptocurrency market simulator."
requires-python = ">=3.12"
readme = "README.md"
keywords = ["simulation", "education", "synthetic-data", "market-simulation", "cryptocurrency"]
classifiers = [
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Scientific/Engineering",
]
# The runtime ranges from requirements.txt, kept in step with it.
# Streamlit 1.53 is the earliest release the dashboard works correctly on
# (measured; see docs/ROADMAP.md, Phase 24). The test suite needs 1.63,
# which requirements-dev.txt asks for.
dependencies = [
    "streamlit>=1.53,<2.0",
    "plotly>=5.22,<6.0",
    "pandas>=2.2,<3.0",
    "PyYAML>=6.0,<7.0",
]

[project.urls]
Repository = "https://github.com/jdgiron12/crypto-simulator"
Documentation = "https://github.com/jdgiron12/crypto-simulator/tree/main/docs"
Issues = "https://github.com/jdgiron12/crypto-simulator/issues"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# The stress suite's costly cases (Phase 16) are marked `slow` and left
# out of an ordinary run, which keeps the suite in seconds; run them with
# `pytest -m slow` or `python scripts/stress_test.py --heavy`.
addopts = "-ra -m 'not slow'"
markers = [
    "slow: a test whose cost is measured in seconds, deselected by default",
]

# Every package under crypto_simulator/; tests, examples and docs stay
# repository-level and are not installed.
[tool.setuptools.packages.find]
include = ["crypto_simulator", "crypto_simulator.*"]

# Non-Python files read at runtime, located next to the modules that use them.
[tool.setuptools.package-data]
"crypto_simulator.config" = ["default.yaml"]
"crypto_simulator.data" = ["schema.sql"]
