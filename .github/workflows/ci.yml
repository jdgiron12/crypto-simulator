name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# The pinned compatibility digests and RW/AMM fingerprints were produced on
# macOS arm64. The random-walk path goes through random.gauss and math.exp,
# whose last-ulp results differ between Apple's libm and glibc, so the same
# seed yields different digests on Linux. CI runs where the pins come from.
jobs:
  test:
    name: Test suite (Python ${{ matrix.python-version }})
    runs-on: macos-latest
    strategy:
      # Let every interpreter finish so a failure on one version is reported
      # alongside the results of the others.
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest
        run: pytest

  slow:
    name: Slow tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # The canonical run deselects `slow` (see addopts in pyproject.toml);
      # this job exercises exactly those cases.
      - name: Run slow tests
        run: pytest -m slow

  compat:
    name: Compatibility checkpoints
    runs-on: macos-latest
    steps:
      # The comparison archives historical checkpoint commits, so it needs
      # the full history rather than the default shallow clone.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Compare checkpoints
        run: python scripts/compat/compare_checkpoints.py

  coverage:
    name: Coverage
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Reporting only: no minimum percentage is enforced.
      - name: Run pytest with coverage
        run: pytest --cov --cov-report=term-missing --cov-report=xml --cov-report=html

      # Summarise the coverage.xml pytest-cov wrote, so the summary carries the
      # same totals as the log. (A later `coverage report` cannot: the suite
      # executes temporary modules that are gone by then.)
      - name: Write coverage summary
        run: |
          python - >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import xml.etree.ElementTree as ET

          root = ET.parse("coverage.xml").getroot()
          valid, covered = int(root.get("lines-valid")), int(root.get("lines-covered"))
          print("## Coverage\n")
          print("| Statements | Covered | Missed | Coverage |")
          print("| ---: | ---: | ---: | ---: |")
          print(f"| {valid} | {covered} | {valid - covered} | {100 * covered / valid:.2f}% |\n")
          print("Line-by-line detail: the job log (term-missing) and the `coverage-html` artifact.")
          EOF

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov/
